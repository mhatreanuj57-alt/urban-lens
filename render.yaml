# Render Blueprint — https://render.com/docs/blueprint-spec
# Apply from the GitHub repo (New+ -> Blueprint -> select a18-n03/Urban-Lens) and
# Render reads this file. Values marked sync:false are never overwritten by a
# redeploy, so secrets you paste in the dashboard survive future pushes.
services:
  - type: web
    name: urban-lens-backend
    runtime: docker
    branch: master
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: TASK_QUEUE_MODE
        value: inline
      # Supabase session pooler (IPv4). Percent-encode '#'/'=' in the password.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        value: https://ilbvlzbfkgeldobgedpx.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # S3-compatible object storage (Cloudflare R2 or Supabase Storage).
      # Uploads are presigned PUTs straight from the browser, so the endpoint
      # must be publicly reachable. Values are provider-specific:
      #   Supabase  ENDPOINT=https://<ref>.supabase.co/storage/v1/s3
      #             PUBLIC_URL_BASE=https://<ref>.supabase.co/storage/v1/object/public/<public-bucket>
      #             REGION=us-east-1  PATH_STYLE=true (its gateway needs the bucket in the path)
      #   R2        ENDPOINT=https://<account>.r2.cloudflarestorage.com
      #             PUBLIC_URL_BASE=<bucket public dev or custom domain URL>
      #             REGION=auto  PATH_STYLE=true
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_URL_BASE
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_PATH_STYLE
        sync: false
      - key: STORAGE_BUCKET_PRIVATE
        value: urbanlens-private
      - key: STORAGE_BUCKET_PUBLIC
        value: urbanlens-public
      - key: CORS_ORIGINS
        value: '["https://urban-lens-seven.vercel.app","http://localhost:3000"]'
      - key: ML_MODEL_PATH
        value: /models
      - key: ML_DEVICE
        value: cpu
